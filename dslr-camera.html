<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DSLR ক্যামেরা</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:#000}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
  video.mirror{transform:scaleX(-1)}
  #grid{position:absolute;inset:0;pointer-events:none;display:none;
    background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
    background-size:33.333% 33.333%;background-position:0 0}
  #grid.on{display:block}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  #flash.go{opacity:.9;transition:none}
  #count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:200;text-shadow:0 2px 20px rgba(0,0,0,.6);pointer-events:none}
  #ring{position:absolute;width:70px;height:70px;border:2px solid #ffd54a;border-radius:10px;display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #ring.show{display:block;animation:pulse .8s ease-out forwards}
  @keyframes pulse{0%{transform:translate(-50%,-50%) scale(1.5);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;justify-content:space-between;gap:8px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .pill{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:8px 12px;font-size:13px;min-width:44px;text-align:center;backdrop-filter:blur(6px)}
  .pill.active{background:#ffd54a;color:#000;border-color:#ffd54a}
  #sliders{position:absolute;left:0;right:0;bottom:0;padding:8px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;flex-direction:column;gap:2px}
  .row{display:none;align-items:center;gap:10px;font-size:12px}
  .row.has{display:flex}
  .row label{width:64px;opacity:.85}
  .row input{flex:1;accent-color:#ffd54a}
  .row span{width:40px;text-align:right;opacity:.85;font-variant-numeric:tabular-nums}
  .bar{display:flex;align-items:center;justify-content:space-around;padding:14px 10px calc(env(safe-area-inset-bottom) + 16px);background:#000}
  .thumb{width:56px;height:56px;border-radius:12px;border:2px solid #444;background:#1a1a1a center/cover no-repeat;position:relative}
  .thumb b{position:absolute;right:-6px;top:-6px;background:#ffd54a;color:#000;font-size:11px;border-radius:10px;padding:1px 6px;display:none}
  .shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;position:relative}
  .shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}
  .shutter:active::after{transform:scale(.86)}
  .shutter:disabled{opacity:.5}
  .round{width:56px;height:56px;border-radius:50%;border:none;background:#222;color:#fff;font-size:24px}
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px;background:#000;line-height:1.6}
  #msg button,#msg label{background:#ffd54a;color:#000;border:none;border-radius:24px;padding:12px 22px;font-size:15px;font-weight:600}
  /* gallery */
  #gal{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
  #gal.open{display:flex}
  .gh{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;font-size:16px}
  .gh button{background:none;border:none;color:#ffd54a;font-size:16px;padding:6px}
  #gg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start;padding-bottom:30px}
  #gg div{aspect-ratio:1;background:#222 center/cover no-repeat}
  #empty{margin:auto;opacity:.6;display:none}
  #view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
  #view.open{display:flex}
  #view img{flex:1;min-height:0;width:100%;object-fit:contain}
  .vb{display:flex;justify-content:space-around;padding:14px 10px calc(env(safe-area-inset-bottom) + 16px)}
  .vb button{background:#222;color:#fff;border:none;border-radius:22px;padding:11px 16px;font-size:14px}
  .vb .del{color:#ff6b6b}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <div id="grid"></div>
    <div id="ring"></div>
    <div id="flash"></div>
    <div id="count"></div>
    <div class="top">
      <button class="pill" id="bFlash">⚡ ফ্ল্যাশ বন্ধ</button>
      <button class="pill" id="bTimer">⏱ টাইমার বন্ধ</button>
      <button class="pill" id="bGrid">▦ গ্রিড</button>
      <button class="pill" id="bSave">💾 ডাউনলোড</button>
    </div>
    <div id="toast"></div>
    <div id="sliders">
      <div class="row" id="rZoom"><label>🔍 জুম</label><input type="range" id="sZoom"><span id="vZoom"></span></div>
      <div class="row" id="rExp"><label>☀ এক্সপোজার</label><input type="range" id="sExp"><span id="vExp"></span></div>
      <div class="row" id="rIso"><label>ISO</label><input type="range" id="sIso"><span id="vIso"></span></div>
    </div>
    <div id="msg"></div>
  </div>
  <div class="bar">
    <button class="thumb" id="bGal" aria-label="গ্যালারি"><b id="cnt"></b></button>
    <button class="shutter" id="bShot" aria-label="ছবি তুলুন"></button>
    <button class="round" id="bFlip" aria-label="ক্যামেরা পাল্টান">🔄</button>
  </div>
</div>

<div id="gal">
  <div class="gh"><button id="gClose">← ফিরে যান</button><span>আমার ছবি</span><span style="width:70px"></span></div>
  <div id="gg"></div>
  <div id="empty">এখনও কোনো ছবি তোলা হয়নি</div>
</div>
<div id="view">
  <img id="vimg" alt="">
  <div class="vb">
    <button id="vClose">← পিছনে</button>
    <button id="vSave">⬇ সেভ</button>
    <button id="vShare">↗ শেয়ার</button>
    <button id="vDel" class="del">🗑 মুছুন</button>
  </div>
</div>

<input type="file" id="fallback" accept="image/*" capture="environment" hidden>

<script>
const $ = s => document.querySelector(s);
const video = $('#v');
let stream = null, track = null, imgCap = null, caps = {};
let facing = 'environment', flashOn = false, timerSec = 0, busy = false;
let saveMode = localStorage.getItem('saveMode') || 'download'; // download | share
let lastThumbURL = null, viewing = null;

/* ---------- ছোট সাহায্যকারী ---------- */
function toast(t, ms = 1800) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), ms);
}
function fname() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `IMG_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
}
function click() {
  try {
    const ac = click.ac || (click.ac = new (window.AudioContext || window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1300;
    g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .08);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .09);
  } catch (e) {}
}

/* ---------- IndexedDB (অ্যাপের নিজস্ব গ্যালারি) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('dslr-cam', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode) { return this.db.transaction('photos', mode).objectStore('photos'); },
  add(blob, name) {
    return new Promise((res, rej) => { const r = this.tx('readwrite').add({ blob, name, t: Date.now() }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  all() {
    return new Promise((res, rej) => { const r = this.tx('readonly').getAll(); r.onsuccess = () => res(r.result.sort((a, b) => b.t - a.t)); r.onerror = () => rej(r.error); });
  },
  del(id) {
    return new Promise((res, rej) => { const r = this.tx('readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  }
};

/* ---------- ক্যামেরা চালু ---------- */
async function startCamera() {
  stopCamera();
  $('#msg').style.display = 'none';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return noCamera('এই ব্রাউজারে সরাসরি ক্যামেরা পাওয়া যাচ্ছে না।');
  try {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 3072 } }, audio: false
      });
    } catch (e) {
      if (e.name === 'NotAllowedError') throw e;
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    const s = track.getSettings ? track.getSettings() : {};
    const front = (s.facingMode === 'user') || (facing === 'user' && !s.facingMode);
    video.classList.toggle('mirror', front);
    caps = track.getCapabilities ? track.getCapabilities() : {};
    imgCap = (window.ImageCapture) ? new ImageCapture(track) : null;
    setupSliders();
    flashOn = false; updateFlashBtn();
  } catch (e) {
    noCamera(e.name === 'NotAllowedError'
      ? 'ক্যামেরার অনুমতি দেওয়া হয়নি। ব্রাউজারের সেটিংস থেকে ক্যামেরা "Allow" করে পেজ রিলোড করুন।'
      : 'ক্যামেরা চালু করা যায়নি।');
  }
}
function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = track = imgCap = null; }
function noCamera(text) {
  const m = $('#msg'); m.style.display = 'flex';
  m.innerHTML = `<div style="font-size:48px">📷</div><div>${text}</div>
    <button id="retry">আবার চেষ্টা করুন</button>
    <label for="fallback">ফোনের ক্যামেরা অ্যাপ দিয়ে ছবি তুলুন</label>
    <div style="font-size:12px;opacity:.6">টিপ: ফাইলটি HTTPS লিংকে (যেমন GitHub Pages / Netlify) খুললে লাইভ ক্যামেরা সবচেয়ে ভালো চলে।</div>`;
  $('#retry').onclick = startCamera;
}

/* ---------- স্লাইডার (জুম / এক্সপোজার / ISO) ---------- */
function bindSlider(key, cap, rowId, sId, vId, fmt) {
  const row = $(rowId), s = $(sId), v = $(vId);
  if (!cap || cap.min === undefined || cap.max === undefined || cap.min === cap.max) { row.classList.remove('has'); return; }
  row.classList.add('has');
  s.min = cap.min; s.max = cap.max; s.step = cap.step || ((cap.max - cap.min) / 100);
  const cur = (track.getSettings && track.getSettings()[key]);
  s.value = cur !== undefined ? cur : (key === 'zoom' ? cap.min : (key === 'exposureCompensation' ? 0 : cap.min));
  v.textContent = fmt(+s.value);
  s.oninput = async () => {
    v.textContent = fmt(+s.value);
    try { await track.applyConstraints({ advanced: [{ [key]: +s.value }] }); } catch (e) {}
  };
}
function setupSliders() {
  bindSlider('zoom', caps.zoom, '#rZoom', '#sZoom', '#vZoom', x => x.toFixed(1) + '×');
  bindSlider('exposureCompensation', caps.exposureCompensation, '#rExp', '#sExp', '#vExp', x => (x > 0 ? '+' : '') + x.toFixed(1));
  bindSlider('iso', caps.iso, '#rIso', '#sIso', '#vIso', x => Math.round(x));
}

/* ---------- ফোকাস (স্ক্রিনে ট্যাপ) ---------- */
$('#stage').addEventListener('click', async e => {
  if (e.target.closest('.top,#sliders,#msg')) return;
  const r = $('#stage').getBoundingClientRect();
  const ring = $('#ring');
  ring.style.left = (e.clientX - r.left) + 'px'; ring.style.top = (e.clientY - r.top) + 'px';
  ring.classList.remove('show'); void ring.offsetWidth; ring.classList.add('show');
  if (!track) return;
  try {
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const adv = {};
    if (caps.focusMode && caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';
    adv.pointsOfInterest = [{ x, y }];
    await track.applyConstraints({ advanced: [adv] });
  } catch (err) {}
});

/* ---------- টপ বাটন ---------- */
function updateFlashBtn() {
  const b = $('#bFlash');
  b.textContent = flashOn ? '⚡ ফ্ল্যাশ চালু' : '⚡ ফ্ল্যাশ বন্ধ';
  b.classList.toggle('active', flashOn);
}
$('#bFlash').onclick = async () => {
  if (!caps.torch) return toast('এই ক্যামেরায় ফ্ল্যাশ/টর্চ সাপোর্ট নেই');
  flashOn = !flashOn;
  try { await track.applyConstraints({ advanced: [{ torch: flashOn }] }); } catch (e) { flashOn = false; toast('ফ্ল্যাশ চালু করা যায়নি'); }
  updateFlashBtn();
};
$('#bTimer').onclick = () => {
  timerSec = timerSec === 0 ? 3 : timerSec === 3 ? 10 : 0;
  $('#bTimer').textContent = timerSec ? `⏱ ${timerSec} সেকেন্ড` : '⏱ টাইমার বন্ধ';
  $('#bTimer').classList.toggle('active', !!timerSec);
};
$('#bGrid').onclick = () => { $('#grid').classList.toggle('on'); $('#bGrid').classList.toggle('active'); };
function updateSaveBtn() { $('#bSave').textContent = saveMode === 'download' ? '💾 ডাউনলোড' : '📤 শেয়ার'; }
$('#bSave').onclick = () => {
  saveMode = saveMode === 'download' ? 'share' : 'download';
  localStorage.setItem('saveMode', saveMode); updateSaveBtn();
  toast(saveMode === 'download' ? 'ছবি সরাসরি ফোনে ডাউনলোড হবে (অ্যান্ড্রয়েডে সেরা)' : 'ছবি তোলার পর "Save Image" শেয়ার মেনু আসবে (আইফোনে সেরা)', 3200);
};
$('#bFlip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };

/* ---------- ছবি তোলা ---------- */
async function shoot() {
  if (busy || !stream) return;
  busy = true; $('#bShot').disabled = true;
  try {
    if (timerSec) {
      const c = $('#count'); c.style.display = 'flex';
      for (let i = timerSec; i > 0; i--) { c.textContent = i; await new Promise(r => setTimeout(r, 1000)); }
      c.style.display = 'none';
    }
    let blob = null;
    if (imgCap) {
      try { blob = await imgCap.takePhoto(flashOn && caps.torch ? {} : {}); } catch (e) { blob = null; }
    }
    if (!blob) {
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
    }
    const f = $('#flash'); f.classList.add('go'); setTimeout(() => f.classList.remove('go'), 60);
    click(); if (navigator.vibrate) navigator.vibrate(30);
    const name = fname();
    await DB.add(blob, name);
    refreshThumb();
    await deliver(blob, name);
  } catch (e) {
    toast('ছবি সেভ করতে সমস্যা হয়েছে');
  } finally {
    $('#count').style.display = 'none'; busy = false; $('#bShot').disabled = false;
  }
}
async function deliver(blob, name) {
  if (saveMode === 'share' && navigator.canShare) {
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); toast('ছবি তোলা হয়েছে ✓'); return; }
      catch (e) { if (e.name === 'AbortError') { toast('ছবি অ্যাপে সংরক্ষিত — গ্যালারি থেকে সেভ করতে পারবেন'); return; } }
    }
  }
  download(blob, name);
  toast('✓ ছবি সেভ হয়েছে: ' + name);
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
$('#bShot').onclick = shoot;

/* ফোনের ক্যামেরা অ্যাপ (ফলব্যাক) */
$('#fallback').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const name = fname(); await DB.add(f, name); refreshThumb(); await deliver(f, name); e.target.value = '';
};

/* ---------- থাম্বনেইল ও গ্যালারি ---------- */
async function refreshThumb() {
  const all = await DB.all();
  const cnt = $('#cnt');
  if (lastThumbURL) URL.revokeObjectURL(lastThumbURL);
  if (all.length) {
    lastThumbURL = URL.createObjectURL(all[0].blob);
    $('#bGal').style.backgroundImage = `url(${lastThumbURL})`;
    cnt.style.display = 'block'; cnt.textContent = all.length;
  } else {
    lastThumbURL = null; $('#bGal').style.backgroundImage = 'none'; cnt.style.display = 'none';
  }
}
let galURLs = [];
async function openGallery() {
  const all = await DB.all();
  galURLs.forEach(u => URL.revokeObjectURL(u)); galURLs = [];
  const g = $('#gg'); g.innerHTML = '';
  $('#empty').style.display = all.length ? 'none' : 'block';
  all.forEach(p => {
    const u = URL.createObjectURL(p.blob); galURLs.push(u);
    const d = document.createElement('div'); d.style.backgroundImage = `url(${u})`;
    d.onclick = () => openView(p, u); g.appendChild(d);
  });
  $('#gal').classList.add('open');
}
function openView(p, u) { viewing = p; $('#vimg').src = u; $('#view').classList.add('open'); }
$('#bGal').onclick = openGallery;
$('#gClose').onclick = () => $('#gal').classList.remove('open');
$('#vClose').onclick = () => $('#view').classList.remove('open');
$('#vSave').onclick = () => { if (viewing) { download(viewing.blob, viewing.name); toast('সেভ হচ্ছে…'); } };
$('#vShare').onclick = async () => {
  if (!viewing) return;
  const file = new File([viewing.blob], viewing.name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch (e) {} }
  else { download(viewing.blob, viewing.name); }
};
$('#vDel').onclick = async () => {
  if (!viewing || !confirm('ছবিটি অ্যাপ থেকে মুছে ফেলবেন? (ফোনে ডাউনলোড হওয়া কপি মুছবে না)')) return;
  await DB.del(viewing.id); viewing = null;
  $('#view').classList.remove('open'); openGallery(); refreshThumb();
};

/* ---------- শুরু ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else if (!$('#gal').classList.contains('open')) startCamera(); });
document.addEventListener('gesturestart', e => e.preventDefault());
(async () => { updateSaveBtn(); try { await DB.open(); await refreshThumb(); } catch (e) {} startCamera(); })();
</script>
</body>
</html>
